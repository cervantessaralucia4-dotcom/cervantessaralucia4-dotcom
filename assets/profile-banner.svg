<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Sara Cervantes — Software Developer</title>
  <desc id="desc">Gradient banner for Sara Cervantes, Software Developer focused on AI and Data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120D1A"/>
      <stop offset="55%" stop-color="#32134D"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <circle cx="1010" cy="112" r="118" fill="none" stroke="#F3E8FF" stroke-opacity=".12" stroke-width="1"/>
  <circle cx="1010" cy="112" r="82" fill="none" stroke="#F3E8FF" stroke-opacity=".16" stroke-width="1"/>
  <circle cx="1010" cy="112" r="46" fill="none" stroke="url(#accent)" stroke-opacity=".85" stroke-width="2"/>
  <circle cx="1096" cy="73" r="6" fill="#F472B6"/>
  <circle cx="937" cy="191" r="4" fill="#C4B5FD"/>
  <path d="M0 266 C240 226 380 318 624 272 S1008 224 1200 258 V320 H0Z" fill="#120D1A" fill-opacity=".25"/>
  <rect x="66" y="61" width="4" height="174" rx="2" fill="url(#accent)"/>
  <text x="96" y="125" fill="#F3E8FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="4">SOFTWARE DEVELOPER  •  AI &amp; DATA</text>
  <text x="92" y="190" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="48" font-weight="750" letter-spacing="1">SARA CERVANTES</text>
